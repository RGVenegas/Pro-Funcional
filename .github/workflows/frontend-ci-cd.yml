name: Frontend CI/CD Pipeline (AWS S3 & CloudFront)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - 'terraform/**'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - 'terraform/**'

jobs:
  build-and-deploy:
    name: Build Vite App & Deploy to AWS S3 / CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias de Frontend
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend (Vite Build)
        run: npm run build

      - name: Desplegar a AWS S3 y CloudFront (Opcional si existen credenciales AWS)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'profuncional-prod-frontend-hosting' }}
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "Secretos de AWS no configurados en GitHub. Omitiendo subida a S3/CloudFront."
            exit 0
          fi
          if ! aws sts get-caller-identity >/dev/null 2>&1; then
            echo "Credenciales de AWS no activas o expiradas. Omitiendo subida a S3/CloudFront."
            exit 0
          fi
          if ! aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "El bucket $S3_BUCKET no existe. Creándolo en AWS..."
            if [ "$AWS_DEFAULT_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$S3_BUCKET"
            else
              aws s3api create-bucket --bucket "$S3_BUCKET" --create-bucket-configuration LocationConstraint="$AWS_DEFAULT_REGION"
            fi
          fi
          aws s3 sync dist/ s3://$S3_BUCKET/ --delete
          if [ -n "$CLOUDFRONT_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
          fi
